services:
  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - app-network
  api:
    build:
      context: API
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./API/app:/usr/src/app
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: sky_map
      MYSQL_USER: sky
      MYSQL_PASSWORD: changeme
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./mariaDB/data:/var/lib/mysql:rw
    networks:
      - app-network

networks:
  app-network:
    driver: bridge